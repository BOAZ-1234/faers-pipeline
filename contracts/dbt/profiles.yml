# 로컬 duckdb를 웨어하우스로 사용 — 인프라 0으로 계약을 강제·검증한다. dev.duckdb 파일 하나가 곧 DB다.
# 계약 강제가 목적이라 seed(수 행 픽스처)만 처리하면 되므로 duckdb로 충분하다.
# 실행 시 --profiles-dir . 로 이 파일을 가리킨다.
#
# b_stage/fct_case_drug_reaction이 A단계 실제 Iceberg 원본(S3)을 직접 읽어야 해서
# httpfs/iceberg 익스텐션 + S3 자격증명(credential_chain, coverage.py와 동일 방식)이
# 필요하다. AWS_PROFILE 환경변수로 쓸 프로필을 지정해서 실행할 것
# (예: AWS_PROFILE=faers-team dbt build --profiles-dir .).
faers_contract:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      threads: 4
      extensions:
        - httpfs
        - iceberg
      settings:
        unsafe_enable_version_guessing: true
